name: Desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.1.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            executable: vtx.exe
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            executable: vtx
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            executable: vtx
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            executable: vtx
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      VTX_VERSION: ${{ inputs.version || github.ref_name }}
      VTX_UPDATE_REPO: vineetpadia/vtx
      VTX_UPDATE_PRIVATE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Set up Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add '${{ matrix.target }}'
          echo "version=$(rustc -V)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            native/target
          key: vtx-${{ runner.os }}-${{ matrix.target }}-${{ steps.rust.outputs.version }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Include the Windows C runtime
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Test desktop tools and updater
        if: runner.os == 'Windows'
        run: cargo test --manifest-path native/Cargo.toml --locked -p triangulate --features parallel,desktop --example vtx
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows release packager
        if: runner.os == 'Windows'
        run: dotnet tool install vpk --version 1.2.161 --tool-path .vpk
      - name: Build desktop app
        run: >-
          cargo build --manifest-path native/Cargo.toml --locked --release
          --target '${{ matrix.target }}' -p triangulate --features parallel,desktop --example vtx
      - name: Verify real Windows update lifecycle
        if: runner.os == 'Windows'
        run: >-
          python scripts/test_windows_updates.py
          --binary 'native/target/${{ matrix.target }}/release/examples/${{ matrix.executable }}'
          --vpk .vpk/vpk.exe --work '${{ runner.temp }}/vtx-update-tests'
      - name: Collect dependency notices
        run: >-
          cargo metadata --manifest-path native/Cargo.toml --locked --format-version 1
          --features triangulate/parallel,triangulate/desktop --filter-platform '${{ matrix.target }}'
          > dependencies.json
      - name: Package non-Windows download
        if: runner.os != 'Windows'
        run: >-
          python scripts/package_release.py --platform '${{ matrix.platform }}'
          --binary 'native/target/${{ matrix.target }}/release/examples/${{ matrix.executable }}'
          --metadata dependencies.json --version "$RELEASE_VERSION"
      - name: Package Windows installer and automatic updates
        if: runner.os == 'Windows'
        run: >-
          python scripts/package_release.py --platform windows-x64
          --binary 'native/target/${{ matrix.target }}/release/examples/${{ matrix.executable }}'
          --metadata dependencies.json --version "$RELEASE_VERSION" --vpk .vpk/vpk.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" \
              --title "VTX $RELEASE_VERSION" --notes-file docs/RELEASE_NOTES.md --latest
          fi
          release_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq '.sha')
          if [ "$release_sha" != "$GITHUB_SHA" ]; then
            echo 'This version already points to a different commit; choose a new version.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_VERSION" dist/* --clobber
